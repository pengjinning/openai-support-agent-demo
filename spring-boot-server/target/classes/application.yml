server:
  port: 8080

spring:
  application:
    name: support-agent
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        model: ${DEEPSEEK_MODEL:deepseek-flash}
        temperature: 0.7

app:
  agent-name: ${AGENT_NAME:Blossom}
